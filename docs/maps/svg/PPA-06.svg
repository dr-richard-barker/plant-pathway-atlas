<text class="ppa-caption" x="40.0" y="654.0">Integrated lipid biosynthesis, membrane remodeling, and turnover. De novo 16:0 and 18:0 fatty acids are synthesized by heteromeric</text>
<text class="ppa-caption" x="40.0" y="668.9">ACCase and the FAS complex in plastids, followed by thioesterase hydrolysis (FATB/FATA). Free fatty acids export to the</text>
<text class="ppa-caption" x="40.0" y="683.7">endoplasmic reticulum for incorporation into triacylglycerols (TAG storage) and structural galactolipids (MGDG/DGDG) by MGD1 and</text>
<text class="ppa-caption" x="40.0" y="698.6">DGD1. Surplus or mobilizing lipids undergo peroxisomal beta-oxidation (ACX, MFP2, PED1/KAT2).</text>
</svg>