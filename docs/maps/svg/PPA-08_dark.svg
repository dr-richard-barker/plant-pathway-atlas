<text class="ppa-caption" x="40.0" y="654.0">Specialized plant secondary metabolism. Phenylalanine is channeled into core phenylpropanoids by PAL, C4H, and 4CL, generating</text>
<text class="ppa-caption" x="40.0" y="668.9">activated 4-coumaroyl-CoA. From this central branchpoint, flux bifurcates into: (1) monolignols via CCR and CAD for cell-wall</text>
<text class="ppa-caption" x="40.0" y="683.7">lignification; and (2) flavonoids via Chalcone Synthase (CHS/TT4), CHI, F3H, and DFR, culminating in vacuolar anthocyanin and</text>
<text class="ppa-caption" x="40.0" y="698.6">proanthocyanidin sequestration via GST transporter TT19.</text>
</svg>