<text class="ppa-caption" x="40.0" y="654.0">Radial passage of water and essential mineral ions from the root rhizosphere through epidermis, cortex, the endodermal Casparian</text>
<text class="ppa-caption" x="40.0" y="668.9">strip barrier, and into the ascending xylem transpirational stream (PMM-12). In outer root tissues, the plasma membrane H+-ATPases</text>
<text class="ppa-caption" x="40.0" y="683.7">(AHA1/AHA2) generate a -160 mV potential that powers influx of nitrate (NRT1.1, NRT2.1/NAR2.1), phosphate (PHT1;1/PHT1;4),</text>
<text class="ppa-caption" x="40.0" y="698.6">potassium (AKT1, HAK5), and iron (FRO2/IRT1). Apoplastic solutes are halted at the endodermis by the Casparian strip, an</text>
<text class="ppa-caption" x="40.0" y="713.4">impermeable ring of lignin organized by CASP1-5 scaffolds, SGN3/GSO1 receptor kinase, and PRX64 peroxidase. Water flows</text>
<text class="ppa-caption" x="40.0" y="728.3">transcellularly via PIP1;2/PIP2;1. In the central stele, minerals are loaded into xylem vessels by specialized efflux transporters</text>
<text class="ppa-caption" x="40.0" y="743.1">(SKOR, PHO1, NRT1.5, BOR1).</text>
</svg>