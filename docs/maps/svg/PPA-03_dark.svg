<text class="ppa-caption" x="40.0" y="654.0">The Calvin-Benson-Bassham (CBB) cycle and photorespiratory salvage pathway. RuBisCO catalyzes both the carboxylation of RuBP</text>
<text class="ppa-caption" x="40.0" y="668.9">yielding 3-PGA and the oxygenation yielding 2-phosphoglycolate. The salvage pathway channels 2-PG through the chloroplast envelope</text>
<text class="ppa-caption" x="40.0" y="683.7">to the peroxisome (GOX, GGAT) and mitochondrion (GDC complex, SHMT), recovering 75% of carbon as 3-PGA while releasing CO2 and</text>
<text class="ppa-caption" x="40.0" y="698.6">NH3.</text>
</svg>