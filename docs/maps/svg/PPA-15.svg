<text class="ppa-caption" x="40.0" y="654.0">Biophysical and biochemical control of stomatal pore aperture in paired guard cells. In response to morning blue light,</text>
<text class="ppa-caption" x="40.0" y="668.9">photoreceptors PHOT1/2 activate BLUS1, stimulating the plasma membrane H+-ATPases (AHA1/2). Resulting hyperpolarization (-150 mV)</text>
<text class="ppa-caption" x="40.0" y="683.7">drives massive K+ influx through KAT1/2 channels, balanced by PEPC-derived malate and chloride uptake, drawing in water via PIP2;1</text>
<text class="ppa-caption" x="40.0" y="698.6">aquaporins and swelling guard cells to open the pore. Under drought, stress-induced ABA triggers PYR/RCAR-mediated activation of</text>
<text class="ppa-caption" x="40.0" y="713.4">SnRK2.6/OST1 kinase, which phosphorylates SLAC1/SLAH3 anion channels and stimulates RBOHD ROS generation. Membrane depolarization</text>
<text class="ppa-caption" x="40.0" y="728.3">(-40 mV) opens GORK potassium release channels, causing turgor collapse and pore closure.</text>
</svg>