<text class="ppa-caption" x="40.0" y="654.0">Membrane transportome mediating water flow, nutrient partitioning, and stomatal turgor dynamics. Electrochemical gradients are</text>
<text class="ppa-caption" x="40.0" y="668.9">generated across the plasma membrane by P-type H+-ATPases (AHA1/2) and across the tonoplast by V-type ATPases and pyrophosphatase</text>
<text class="ppa-caption" x="40.0" y="683.7">AVP1. These gradients drive secondary active solute transport: inward/outward potassium rectification (AKT1, KAT1, GORK),</text>
<text class="ppa-caption" x="40.0" y="698.6">aquaporin-mediated water permeation (PIP/TIP), and regulated anion efflux (SLAC1, ALMT12) controlling guard cell movement.</text>
