<text class="ppa-caption" x="40.0" y="686.6">Integrated lipid biosynthesis, membrane remodeling, and turnover. De novo 16:0 and 18:0 fatty acids are synthesized by heteromeric</text>
<text class="ppa-caption" x="40.0" y="701.4">ACCase and the FAS complex in plastids, followed by thioesterase hydrolysis (FATB/FATA). Free fatty acids export to the</text>
<text class="ppa-caption" x="40.0" y="716.3">endoplasmic reticulum for incorporation into triacylglycerols (TAG storage) and structural galactolipids (MGDG/DGDG) by MGD1 and</text>
<text class="ppa-caption" x="40.0" y="731.1">DGD1. Surplus or mobilizing lipids undergo peroxisomal beta-oxidation (ACX, MFP2, PED1/KAT2).</text>
</svg>