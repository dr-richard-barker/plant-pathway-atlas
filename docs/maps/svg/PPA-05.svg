<text class="ppa-caption" x="40.0" y="754.2">Spatial and biochemical architecture of plant reactive oxygen species (ROS) metabolism. Covers apoplastic oxidative bursts</text>
<text class="ppa-caption" x="40.0" y="769.1">catalyzed by respiratory burst oxidase homologs (RBOHD/F), superoxide dismutation by compartment-specific SOD isoforms (Cu/Zn-SOD,</text>
<text class="ppa-caption" x="40.0" y="783.9">Fe-SOD, Mn-SOD), peroxide detoxification via the ascorbate-glutathione cycle (APX, MDHAR, DHAR, GR) and peroxisomal catalases, and</text>
<text class="ppa-caption" x="40.0" y="798.8">downstream thioredoxin/glutaredoxin redox switches.</text>
