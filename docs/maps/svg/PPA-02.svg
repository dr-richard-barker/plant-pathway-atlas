<text class="ppa-caption" x="40.0" y="654.0">Photosynthetic light reactions and thylakoid bioenergetics redrawn with deterministic geometry. Captures linear electron flow from</text>
<text class="ppa-caption" x="40.0" y="668.9">water splitting at photosystem II (PSII) through the plastoquinone pool, cytochrome b6f complex, and plastocyanin to photosystem I</text>
<text class="ppa-caption" x="40.0" y="683.7">(PSI), with ferredoxin-NADP+ reductase (FNR) producing NADPH. Cyclic electron flow via PGR5/PGRL1 and the chloroplast ATP synthase</text>
<text class="ppa-caption" x="40.0" y="698.6">CF0-CF1 complex are explicitly resolved.</text>
