<text class="ppa-caption" x="40.0" y="654.0">Primary inorganic nitrogen and sulfur assimilation in plants. Soil nitrate is reduced to nitrite in the cytosol by Nitrate</text>
<text class="ppa-caption" x="40.0" y="668.9">Reductase (NIA1/2), transported into the chloroplast, and reduced to ammonium by Nitrite Reductase (NIR1). Ammonium is assimilated</text>
<text class="ppa-caption" x="40.0" y="683.7">into glutamate and glutamine via the coupled GS-GOGAT cycle. Concurrently, imported sulfate is activated by ATP Sulfurylase (APS)</text>
<text class="ppa-caption" x="40.0" y="698.6">and reduced by APR and SiR to sulfide, which is condensed with O-acetylserine by OAS-TL to form cysteine.</text>
</svg>