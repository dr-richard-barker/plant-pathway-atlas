<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 680" width="920" height="680" data-theme="light" data-map-id="PPA-07"><defs><style>
:root {
  --ppa-bg: #ffffff;
  --ppa-ink: #0f172a;
  --ppa-ink-soft: #475569;
  --ppa-node-fill: #f8fafc;
  --ppa-node-stroke: #1e293b;
  --ppa-hairline: #cbd5e1;
  --ppa-edge: #475569;
  --ppa-compartment-fill: rgba(15, 23, 42, 0.035);
  --ppa-compartment-stroke: rgba(15, 23, 42, 0.22);
  --ppa-accent: #0284c7;
  --ppa-up: #D55E00;
  --ppa-down: #0072B2;
}
:root[data-theme="dark"] {
  --ppa-bg: #0b0f17;
  --ppa-ink: #f1f5f9;
  --ppa-ink-soft: #94a3b8;
  --ppa-node-fill: #151c28;
  --ppa-node-stroke: #cbd5e1;
  --ppa-hairline: #334155;
  --ppa-edge: #94a3b8;
  --ppa-compartment-fill: rgba(255, 255, 255, 0.04);
  --ppa-compartment-stroke: rgba(255, 255, 255, 0.25);
  --ppa-accent: #38bdf8;
  --ppa-up: #ea580c;
  --ppa-down: #38bdf8;
}

.ppa-canvas { fill: var(--ppa-bg, #ffffff); }
text { font-family: 'DejaVu Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: var(--ppa-ink); }
.ppa-title { font-size: 20.0px; font-weight: 700; fill: var(--ppa-ink); }
.ppa-subtitle { font-size: 12.0px; fill: var(--ppa-ink-soft); }
.ppa-caption { font-size: 11.0px; fill: var(--ppa-ink-soft); line-height: 1.4; }
.ppa-label { font-size: 12.0px; font-weight: 600; text-anchor: middle; }
.ppa-sub { font-size: 9.5px; fill: var(--ppa-ink-soft); font-weight: 400; text-anchor: middle; }
.ppa-subunit-text { font-size: 8.5px; font-weight: 600; fill: var(--ppa-ink); text-anchor: middle; }
.ppa-edge-label {
  font-size: 9.5px;
  fill: var(--ppa-ink-soft);
  font-weight: 500;
  text-anchor: middle;
  paint-order: stroke fill;
  stroke: var(--ppa-bg, #ffffff);
  stroke-width: 3px;
  stroke-linejoin: round;
}

.ppa-compartment-band {
  fill: var(--ppa-compartment-fill);
  stroke: var(--ppa-compartment-stroke);
  stroke-width: 1.5px;
  stroke-dasharray: 6 3;
  rx: 10px;
}
.ppa-compartment-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  fill: var(--ppa-ink-soft);
}

.ppa-node {
  cursor: pointer;
  transition: transform 0.15s ease, filter 0.15s ease;
}
.ppa-node:hover {
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
}
.ppa-node rect, .ppa-node circle, .ppa-node path {
  stroke: var(--ppa-node-stroke);
  stroke-width: 1.5px;
  transition: fill 0.25s ease, stroke 0.25s ease;
}
.ppa-node.significant rect {
  stroke-width: 2.5px;
  stroke: var(--ppa-ink);
}
.ppa-node.non-significant rect {
  stroke-width: 1.0px;
  stroke-dasharray: 3 2;
  stroke: var(--ppa-hairline);
}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="var(--ppa-edge)" /></marker>
