<text class="ppa-caption" x="40.0" y="654.0">Integrated plant hormone networks. Compares the parallel derepression logic of the major phytohormones: (1) Auxin perception by</text>
<text class="ppa-caption" x="40.0" y="668.9">SCFTIR1 triggering Aux/IAA degradation and ARF release; (2) Abscisic acid (ABA) binding to PYR/PYL/RCARs relieving PP2C inhibition</text>
<text class="ppa-caption" x="40.0" y="683.7">of SnRK2 kinases; (3) Jasmonate-isoleucine (JA-Ile) mediated SCFCOI1 destruction of JAZ repressors freeing MYC2; and (4)</text>
<text class="ppa-caption" x="40.0" y="698.6">Gibberellin (GA) and Ethylene circuits regulating DELLA degradation and EIN2/EIN3 transcriptional activation.</text>
