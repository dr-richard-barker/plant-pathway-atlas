<text class="ppa-caption" x="40.0" y="654.0">Cellular protein homeostasis, refolding, and degradation machinery. Nascent polypeptide chains are folded in the ER lumen by BiP</text>
<text class="ppa-caption" x="40.0" y="668.9">chaperones, calreticulin, and protein disulfide isomerases (PDI). Misfolded or regulatory proteins undergo targeted ubiquitination</text>
<text class="ppa-caption" x="40.0" y="683.7">via sequential E1-E2-E3 cascades (including cullin-RING E3 ligases) and are degraded by the ATP-dependent 26S proteasome. Large</text>
<text class="ppa-caption" x="40.0" y="698.6">protein aggregates and damaged organelles are sequestered into autophagosomes via the ATG8 core conjugation machinery for vacuolar</text>
<text class="ppa-caption" x="40.0" y="713.4">lytic turnover.</text>
</svg>