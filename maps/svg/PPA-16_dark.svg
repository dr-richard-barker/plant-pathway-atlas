<text class="ppa-caption" x="40.0" y="654.0">Spatial regulation of symplastic connectivity and short-to-long distance cell-to-cell communication. Transport through</text>
<text class="ppa-caption" x="40.0" y="668.9">plasmodesmata (PD) cytoplasmic sleeves is governed by dynamic callose deposition: callose synthases (CalS1/8/10) constrict the</text>
<text class="ppa-caption" x="40.0" y="683.7">pore to restrict the size exclusion limit (SEL), while beta-1,3-glucanases (PDCB1/2) degrade callose to permit passage of mobile</text>
<text class="ppa-caption" x="40.0" y="698.6">transcription factors (SHR, WUS) and non-cell-autonomous small RNAs. Apoplastic peptide hormones (CLV3, RALF1) signal via LRR</text>
<text class="ppa-caption" x="40.0" y="713.4">receptor-like kinases (CLV1, FERONIA) to coordinate stem-cell niches and cell expansion, while systemic electrical and calcium</text>
<text class="ppa-caption" x="40.0" y="728.3">waves propagate through glutamate receptor-like channels (GLR3.3/3.6) and vacuolar TPC1.</text>
</svg>