<text class="ppa-caption" x="40.0" y="679.1">sucrose partitioning and glycolysis, mitochondrial tricarboxylic acid (TCA) flux, and respiratory electron transport via the</text>
<text class="ppa-caption" x="40.0" y="693.9">cytochrome and alternative oxidase (AOX) pathways. Multi-subunit holoenzymes and multi-gene families are rendered using adaptive</text>
<text class="ppa-caption" x="40.0" y="708.8">vector glyphs (&quot;Chicklets 2.0&quot;) with true font metrics.</text>
