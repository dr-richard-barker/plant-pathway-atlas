<text class="ppa-caption" x="40.0" y="690.6">Long-distance vasculature sucrose and nutrient partitioning (PMM-11). Connects chloroplast photosynthetic carbon fixation in</text>
<text class="ppa-caption" x="40.0" y="705.4">mature source leaves to heterotrophic sink respiration in roots. In source minor veins, sucrose is exported into the apoplast by</text>
<text class="ppa-caption" x="40.0" y="720.3">SWEET11/12/15 uniporters and actively concentrated into companion cells by the SUC2/SUT1 H+-symporter energized by AHA3 (or</text>
<text class="ppa-caption" x="40.0" y="735.1">symplastically trapped via GOLS/RFS raffinose polymers). Hydrostatic pressure drives sap flow through sieve tubes guarded by CalS7</text>
<text class="ppa-caption" x="40.0" y="750.0">callose collars and SEOR1/2 filaments. In sink roots, sucrose is unloaded apoplastically via CWINV1/2/4 and STP1/4/13 hexose</text>
<text class="ppa-caption" x="40.0" y="764.8">symporters, or cleaved symplastically by SUS1/4 to fuel mitochondrial respiration.</text>
</svg>