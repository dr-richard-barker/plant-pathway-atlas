<text class="ppa-caption" x="40.0" y="654.0">Integrated plant defense and acclimation pathways. Plasma membrane pattern recognition receptors (FLS2/BAK1) perceive bacterial</text>
<text class="ppa-caption" x="40.0" y="668.9">flagellin (flg22), activating BIK1 transphosphorylation and triggering the canonical MPK3/MPK6 signaling cascade. Concurrently,</text>
<text class="ppa-caption" x="40.0" y="683.7">environmental temperature and osmotic fluctuations activate the CBF1-3/DREB regulon for cold/freezing tolerance and HSFA1/HSFA2</text>
<text class="ppa-caption" x="40.0" y="698.6">for heat shock protein (HSP70/90) chaperone induction.</text>
