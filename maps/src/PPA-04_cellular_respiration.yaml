# PPA-04 — Cellular Respiration & Mitochondrial Electron Transport
# Declarative pathway source without hardcoded coordinates.

id: PPA-04
title: Cellular Respiration & Mitochondrial ETC
subtitle: Tricarboxylic acid cycle, classical respiratory complexes I-V, and plant-specific alternative bypasses
derived_from: MapMan4 BIN 8 TCA Cycle & BIN 9 Mitochondrial ETC, PlantCyc TCA & RESPIRATION-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  Mitochondrial oxidative phosphorylation and respiratory electron transport chain. Substrates
  derived from the TCA cycle feed electrons into classical Complex I (NADH DH) and Complex II
  (Succinate DH), as well as plant-specific rotenone-insensitive external/internal NAD(P)H
  dehydrogenases (NDA, NDB). Electrons funnel through ubiquinone to either classical Complex III/IV
  (generating a proton gradient for Complex V ATP synthase) or cyanide-resistant Alternative
  Oxidases (AOX1A/D), dissipating redox pressure as heat without proton translocation.

lanes:
  - id: tca_cycle_matrix
    compartment: mitochondrial_matrix
    node_width: 220
    nodes: [TCA_SUBSTRATE_CORE, TCA_DEHYDROGENASES, MALATE_FUMARATE_POOL]

  - id: input_dehydrogenases
    compartment: mitochondrial_inner_membrane
    node_width: 220
    nodes: [COMPLEX_I_NADH, ROTENONE_INSENSITIVE_NDH, COMPLEX_II_SDH]

  - id: ubiquinol_partitioning
    compartment: mitochondrial_inner_membrane
    node_width: 210
    nodes: [AOX_ALTERNATIVE_OXIDASE, UBIQUINONE_POOL, UNCOUPLING_PROTEINS]

  - id: classical_terminal_etc
    compartment: mitochondrial_inner_membrane
    node_width: 220
    nodes: [COMPLEX_III_BC1, CYTOCHROME_C_SOLUBLE, COMPLEX_IV_COX]

  - id: phosphorylation_complex
    compartment: mitochondrial_inner_membrane
    node_width: 210
    nodes: [PHOSPHATE_CARRIER, ADENINE_NUCLEOTIDE_TR, COMPLEX_V_F1F0]

