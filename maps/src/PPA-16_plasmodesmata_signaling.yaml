# PPA-16 — Plasmodesmata Gating & Intercellular Communication
# Declarative pathway source without hardcoded coordinates.

id: PPA-16
title: Plasmodesmata Gating & Intercellular Signaling
subtitle: Callose neck constriction, symplastic mobile factors, peptide receptors, and electrical waves
derived_from: MapMan4 BIN 30 Signaling & BIN 33 Development, PlantCyc INTERCELLULAR-SIGNALING-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  Spatial regulation of symplastic connectivity and short-to-long distance cell-to-cell communication.
  Transport through plasmodesmata (PD) cytoplasmic sleeves is governed by dynamic callose deposition:
  callose synthases (CalS1/8/10) constrict the pore to restrict the size exclusion limit (SEL), while
  beta-1,3-glucanases (PDCB1/2) degrade callose to permit passage of mobile transcription factors (SHR, WUS)
  and non-cell-autonomous small RNAs. Apoplastic peptide hormones (CLV3, RALF1) signal via LRR receptor-like
  kinases (CLV1, FERONIA) to coordinate stem-cell niches and cell expansion, while systemic electrical and
  calcium waves propagate through glutamate receptor-like channels (GLR3.3/3.6) and vacuolar TPC1.

lanes:
  - id: callose_neck_gating
    compartment: plasmodesmata_neck
    node_width: 220
    nodes: [CALLOSE_SYNTHASES_CALS, GLUCANASES_PDCB, PDLP_IMMUNE_SENSORS]

  - id: symplastic_mobile_factors
    compartment: symplastic_cytoplasmic_sleeve
    node_width: 220
    nodes: [WUS_APICAL_ORGANIZER, MOBILE_SHR_SCR_AXIS, MOBILE_SMALL_RNAS]

  - id: apoplastic_peptide_receptors
    compartment: apoplast_plasma_membrane
    node_width: 220
    nodes: [CLV3_CLV1_STEM_NICHE, RALF_FERONIA_EXPANSION, IDA_HAE_ABSCISSION]

  - id: rapid_electrical_waves
    compartment: plasma_membrane_calcium
    node_width: 220
    nodes: [GLR_GLUTAMATE_CHANNELS, TPC1_VACUOLAR_CALCIUM, SYSTEMIC_WAVE_PROPAGATION]

