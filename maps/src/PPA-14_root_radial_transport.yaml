# PPA-14 (PMM-12) — Root Radial Transport: Symplastic & Apoplastic Pathways & Casparian Barrier
# Declarative pathway source without hardcoded coordinates.

id: PPA-14
title: Root Radial Transport & Casparian Strip Barrier
subtitle: Radial nutrient uptake from soil through cortex and endodermis into ascending xylem stream
derived_from: MapMan4 BIN 34 Transport & PlantCyc ROOT-RADIAL-TRANSPORT-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  Radial passage of water and essential mineral ions from the root rhizosphere through epidermis,
  cortex, the endodermal Casparian strip barrier, and into the ascending xylem transpirational stream (PMM-12).
  In outer root tissues, the plasma membrane H+-ATPases (AHA1/AHA2) generate a -160 mV potential that powers
  influx of nitrate (NRT1.1, NRT2.1/NAR2.1), phosphate (PHT1;1/PHT1;4), potassium (AKT1, HAK5), and iron (FRO2/IRT1).
  Apoplastic solutes are halted at the endodermis by the Casparian strip, an impermeable ring of lignin organized
  by CASP1-5 scaffolds, SGN3/GSO1 receptor kinase, and PRX64 peroxidase. Water flows transcellularly via PIP1;2/PIP2;1.
  In the central stele, minerals are loaded into xylem vessels by specialized efflux transporters (SKOR, PHO1, NRT1.5, BOR1).

