    node_width: 220
    nodes: [ROOT_PM_PROTON_PUMPS, NITRATE_UPTAKE_NRT, PHOSPHATE_UPTAKE_PHT, POTASSIUM_UPTAKE_AKT]

  - id: micronutrients_water_flux
