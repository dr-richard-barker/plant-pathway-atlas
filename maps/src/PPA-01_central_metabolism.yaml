# PPA-01 — Central Metabolism Overview (Modernized MapMan Overview)
# Declarative pathway source without hardcoded coordinates.

id: PPA-01
title: Central Metabolism Overview
subtitle: Compartmentalized carbon flux, photosynthesis, glycolysis, TCA cycle, and mitochondrial bioenergetics
derived_from: MapMan Classic Metabolism Overview & PlantCyc Central Carbon Flux
species_anchor: arabidopsis_thaliana

caption: >-
  Modernized MapMan central metabolism overview. Integrates Calvin-Benson carbon fixation
  in the chloroplast stroma, cytosolic sucrose partitioning and glycolysis, mitochondrial
  tricarboxylic acid (TCA) flux, and respiratory electron transport via the cytochrome
  and alternative oxidase (AOX) pathways. Multi-subunit holoenzymes and multi-gene families
  are rendered using adaptive vector glyphs ("Chicklets 2.0") with true font metrics.

lanes:
  - id: plastid_carbon
    compartment: chloroplast_stroma
    node_width: 200
    nodes: [CALVIN_CYCLE, STARCH_TURNOVER, PLASTID_FA_SYNTH]

  - id: carbon_export
    compartment: cytosol
    node_width: 190
    nodes: [TRIOSE_P_EXPORT, SUCROSE_METABOLISM, HEXOSE_P_POOL]

  - id: cytosolic_glycolysis
    compartment: cytosol
    node_width: 200
    nodes: [GLYCOLYSIS_UPPER, GLYCOLYSIS_LOWER, PYRUVATE_POOL]

  - id: mitochondrial_flux
    compartment: mitochondrial_matrix
    node_width: 210
    nodes: [PYRUVATE_DH, TCA_CYCLE, AMINO_ACID_PRECURSORS]

  - id: mitochondrial_etc
    compartment: mitochondrial_inner_membrane
    node_width: 210
    nodes: [RESPIRATORY_ETC, AOX_BYPASS, ATP_SYNTHASE]

