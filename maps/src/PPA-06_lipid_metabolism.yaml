# PPA-06 — Lipid Metabolism & Membrane Dynamics
# Declarative pathway source without hardcoded coordinates.

id: PPA-06
title: Lipid Metabolism & Membrane Dynamics
subtitle: Plastid de novo fatty acid synthesis, ER eukaryotic Kennedy pathway, and peroxisomal beta-oxidation
derived_from: MapMan4 BIN 11 Lipid Metabolism, PlantCyc FATTY-ACID-SYN-PWY & TRIGLYCERIDE-SYN-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  Integrated lipid biosynthesis, membrane remodeling, and turnover. De novo 16:0 and 18:0 fatty
  acids are synthesized by heteromeric ACCase and the FAS complex in plastids, followed by thioesterase
  hydrolysis (FATB/FATA). Free fatty acids export to the endoplasmic reticulum for incorporation
  into triacylglycerols (TAG storage) and structural galactolipids (MGDG/DGDG) by MGD1 and DGD1.
  Surplus or mobilizing lipids undergo peroxisomal beta-oxidation (ACX, MFP2, PED1/KAT2).

lanes:
  - id: plastid_de_novo_fa
    compartment: chloroplast_stroma
    node_width: 220
    nodes: [PLASTID_ACCASE, FAS_ELONGATION, THIOESTERASE_EXPORT]

  - id: er_eukaryotic_assembly
    compartment: endoplasmic_reticulum
    node_width: 220
    nodes: [GLYCEROL_ACYLATION_GPAT, PHOSPHATIDIC_ACID_POOL, TRIACYLGLYCEROL_DGAT]

  - id: membrane_galactolipids
    compartment: chloroplast_envelope
    node_width: 210
    nodes: [MGDG_SYNTHASE_MGD1, DGDG_SYNTHASE_DGD1, FATTY_ACID_DESATURASES]

  - id: peroxisome_turnover
    compartment: peroxisome
    node_width: 220
    nodes: [ACYL_COA_OXIDASE_ACX, MULTIFUNCTIONAL_MFP2, KETOACYL_THIOLASE_PED1]

