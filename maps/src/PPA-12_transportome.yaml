# PPA-12 — Plant Transportome & Solute Allocation
# Declarative pathway source without hardcoded coordinates.

id: PPA-12
title: Plant Transportome & Solute Allocation
subtitle: Membrane aquaporins, potassium channels, proton energization, and vacuolar compartmentalization
derived_from: MapMan4 BIN 34 Transport & PlantCyc TRANSPORT-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  Membrane transportome mediating water flow, nutrient partitioning, and stomatal turgor dynamics.
  Electrochemical gradients are generated across the plasma membrane by P-type H+-ATPases (AHA1/2) and
  across the tonoplast by V-type ATPases and pyrophosphatase AVP1. These gradients drive secondary active
  solute transport: inward/outward potassium rectification (AKT1, KAT1, GORK), aquaporin-mediated water
  permeation (PIP/TIP), and regulated anion efflux (SLAC1, ALMT12) controlling guard cell movement.

lanes:
  - id: pm_proton_and_potassium
    compartment: plasma_membrane
    node_width: 220
    nodes: [PM_H_ATPASE_AHA, INWARD_K_CHANNELS, OUTWARD_K_CHANNELS]

  - id: pm_water_calcium_anion
    compartment: plasma_membrane
    node_width: 220
    nodes: [PLASMA_MEMBRANE_PIPS, AQUAPORIN_GATING, CALCIUM_PERMEABLE_CNGC, SLAC1_ANION_CHANNEL]

  - id: tonoplast_energization
    compartment: vacuolar_membrane
    node_width: 220
    nodes: [VACUOLAR_V_ATPASE, TONOPLAST_PYROPHOSPHATASE, TONOPLAST_TIPS]

  - id: tonoplast_solute_transport
    compartment: vacuolar_membrane
    node_width: 220
    nodes: [ALMT_MALATE_TRANSPORTER, ABC_TRANSPORTERS_EXPORTERS]

