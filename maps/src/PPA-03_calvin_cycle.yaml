# PPA-03 — Calvin-Benson Cycle & Photorespiratory Salvage
# Declarative pathway source without hardcoded coordinates.

id: PPA-03
title: Calvin-Benson Cycle & Photorespiration
subtitle: Chloroplast carbon assimilation and peroxisome-mitochondria photorespiratory salvage flux
derived_from: MapMan4 BIN 1.2 & BIN 1.3 Photorespiration, PlantCyc CALVIN-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  The Calvin-Benson-Bassham (CBB) cycle and photorespiratory salvage pathway. RuBisCO catalyzes
  both the carboxylation of RuBP yielding 3-PGA and the oxygenation yielding 2-phosphoglycolate.
  The salvage pathway channels 2-PG through the chloroplast envelope to the peroxisome (GOX, GGAT)
  and mitochondrion (GDC complex, SHMT), recovering 75% of carbon as 3-PGA while releasing CO2 and NH3.

lanes:
  - id: carboxylation_reduction
    compartment: chloroplast_stroma
    node_width: 210
    nodes: [RUBISCO_CARBOXYLATION, PGA_REDUCTION, TRIOSE_ISOMERIZATION]

  - id: rubp_regeneration
    compartment: chloroplast_stroma
    node_width: 210
    nodes: [PRK_REGENERATION, TRANSKETOLASE_SBPASE, ALDOLASE_FBPASE]

  - id: photorespiration_peroxisome
    compartment: peroxisome
    node_width: 220
    nodes: [PGLP_DEPHOSPHO, GLYCOLATE_OXIDASE, GLUTAMATE_GLYOXYLATE_AT]

  - id: photorespiration_mitochondria
    compartment: mitochondrial_matrix
    node_width: 220
    nodes: [HYDROXYPYRUVATE_RED, SERINE_HYDROXYMETHYL_TF, GLYCINE_DECARBOXYLASE]

