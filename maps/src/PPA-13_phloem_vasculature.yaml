  - id: sieve_tube_translocation
    compartment: sieve_element_conduit
    node_width: 220
    nodes: [CALS7_SIEVE_PLATE_CALLOSE, SEOR_PROTECTIVE_FILAMENTS, PHLOEM_SAP_TRANSLOCATION]

  - id: sink_root_apoplastic_unloading
