# PPA-13 (PMM-11) — Phloem Vasculature Sucrose & Nutrient Loading, Transport & Unloading
# Declarative pathway source without hardcoded coordinates.

id: PPA-13
title: Phloem Vasculature Sucrose & Nutrient Transport
subtitle: Source minor vein apoplastic/symplastic loading, sieve tube Münch pressure flow, and sink unloading
derived_from: MapMan4 BIN 34 Transport & BIN 2 Carbohydrate Metabolism, PlantCyc SUCROSE-UTILIZATION-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  Long-distance vasculature sucrose and nutrient partitioning (PMM-11). Connects chloroplast
  photosynthetic carbon fixation in mature source leaves to heterotrophic sink respiration in roots.
  In source minor veins, sucrose is exported into the apoplast by SWEET11/12/15 uniporters and actively
  concentrated into companion cells by the SUC2/SUT1 H+-symporter energized by AHA3 (or symplastically
  trapped via GOLS/RFS raffinose polymers). Hydrostatic pressure drives sap flow through sieve tubes
  guarded by CalS7 callose collars and SEOR1/2 filaments. In sink roots, sucrose is unloaded apoplastically
  via CWINV1/2/4 and STP1/4/13 hexose symporters, or cleaved symplastically by SUS1/4 to fuel mitochondrial respiration.

