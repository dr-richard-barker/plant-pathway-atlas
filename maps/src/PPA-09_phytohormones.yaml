# PPA-09 — Phytohormone Networks & Crosstalk
# Declarative pathway source without hardcoded coordinates.

id: PPA-09
title: Phytohormone Networks & Crosstalk
subtitle: Core biosynthetic modules and derepression signaling circuits for Auxin, ABA, JA, GA, and Ethylene
derived_from: MapMan4 BIN 17 Hormone Metabolism & BIN 30 Signaling, PlantCyc HORMONE-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  Integrated plant hormone networks. Compares the parallel derepression logic of the major phytohormones:
  (1) Auxin perception by SCFTIR1 triggering Aux/IAA degradation and ARF release; (2) Abscisic acid (ABA)
  binding to PYR/PYL/RCARs relieving PP2C inhibition of SnRK2 kinases; (3) Jasmonate-isoleucine (JA-Ile)
  mediated SCFCOI1 destruction of JAZ repressors freeing MYC2; and (4) Gibberellin (GA) and Ethylene
  circuits regulating DELLA degradation and EIN2/EIN3 transcriptional activation.

lanes:
  - id: auxin_signaling_axis
    compartment: cytosol
    node_width: 220
    nodes: [AUXIN_BIOSYNTHESIS, PIN_POLAR_TRANSPORTERS, AUXIN_RECEPTOR_TIR1]

  - id: aba_stress_axis
    compartment: cytosol
    node_width: 220
    nodes: [ABA_BIOSYNTHESIS_NCED3, PYR_PYL_RECEPTORS, SNRK2_KINASE_OST1]

  - id: jasmonate_defense_axis
    compartment: cytosol
    node_width: 220
    nodes: [JA_BIOSYNTHESIS_LOX_AOS, COI1_JAZ_DEREPRESSION, MYC2_TRANSCRIPTION]

  - id: ga_ethylene_growth_axis
    compartment: nucleus
    node_width: 220
    nodes: [GA_GID1_DELLA_CASCADE, ETHYLENE_ETR1_EIN2, NUCLEAR_TRANSCRIPTION_FACTORS]

