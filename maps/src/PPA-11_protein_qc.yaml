# PPA-11 — Protein Quality Control & Ubiquitin-Proteasome System
# Declarative pathway source without hardcoded coordinates.

id: PPA-11
title: Protein Quality Control & Turnover
subtitle: Endoplasmic reticulum folding, ubiquitin E1-E2-E3 conjugation, 26S proteasome, and autophagy
derived_from: MapMan4 BIN 29 Protein Turnover & BIN 28 Protein Synthesis, PlantCyc PROTEIN-TURNOVER-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  Cellular protein homeostasis, refolding, and degradation machinery. Nascent polypeptide chains
  are folded in the ER lumen by BiP chaperones, calreticulin, and protein disulfide isomerases (PDI).
  Misfolded or regulatory proteins undergo targeted ubiquitination via sequential E1-E2-E3 cascades
  (including cullin-RING E3 ligases) and are degraded by the ATP-dependent 26S proteasome. Large protein
  aggregates and damaged organelles are sequestered into autophagosomes via the ATG8 core conjugation
  machinery for vacuolar lytic turnover.

