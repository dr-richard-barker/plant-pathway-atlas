# PPA-10 — Biotic & Abiotic Stress Signaling
# Declarative pathway source without hardcoded coordinates.

id: PPA-10
title: Biotic & Abiotic Stress Pathways
subtitle: Pattern-triggered immunity (PTI), MAPK cascades, CBF/DREB regulon, and heat shock factors
derived_from: MapMan4 BIN 20 Stress Pathways, PlantCyc IMMUNE-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  Integrated plant defense and acclimation pathways. Plasma membrane pattern recognition receptors
  (FLS2/BAK1) perceive bacterial flagellin (flg22), activating BIK1 transphosphorylation and triggering
  the canonical MPK3/MPK6 signaling cascade. Concurrently, environmental temperature and osmotic
  fluctuations activate the CBF1-3/DREB regulon for cold/freezing tolerance and HSFA1/HSFA2 for heat shock
  protein (HSP70/90) chaperone induction.

lanes:
  - id: pattern_recognition_pm
    compartment: plasma_membrane
    node_width: 220
    nodes: [PRR_FLS2_BAK1, BIK1_RECEPTOR_KINASE, RBOHD_BURST]

  - id: mapk_cascade_core
    compartment: cytosol
    node_width: 220
    nodes: [MAPKKK_MAPKK_MODULE, MPK3_MPK6_KINASES, WRKY33_TF_HUB]

  - id: cbf_dreb_cold_drought
    compartment: nucleus
    node_width: 220
    nodes: [CBF_DREB1_REGULON, COR_GENE_EFFECTORS, PROLINE_OSMOPROTECTANTS]

  - id: heat_shock_chaperones
    compartment: cytosol
    node_width: 220
    nodes: [HSFA_MASTER_FACTORS, HSP70_CHAPERONE_CORE, HSP90_PROTEIN_COMPLEX]

