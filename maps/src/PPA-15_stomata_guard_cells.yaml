    node_width: 220
    nodes: [PYR_ABA_RECEPTOR_HUB, OST1_SNRK2_KINASE, RBOHD_OXIDATIVE_BURST]

  - id: depolarization_turgor_collapse
    compartment: vacuole
    node_width: 220
    nodes: [SLAC1_ANION_CHANNELS, OUTWARD_POTASSIUM_GORK, TURGOR_COLLAPSE_CLOSURE]

