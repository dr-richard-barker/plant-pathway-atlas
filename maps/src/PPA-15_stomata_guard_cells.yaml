  - id: blue_light_membrane_activation
    compartment: guard_cell_plasma_membrane
    node_width: 220
    nodes: [PHOT1_PHOT2_SENSORS, PM_PROTON_PUMP_AHA, INWARD_POTASSIUM_KAT, AQUAPORIN_WATER_INFLUX]

  - id: osmotic_solute_accumulation
    compartment: guard_cell_cytosol
    node_width: 220
    nodes: [BLUS1_KINASE_RELAY, MALATE_SYNTHESIS_PEPC, TONOPLAST_MALATE_ALMT9]

  - id: aba_drought_closing_signal
