# PPA-15 — Stomata Guard Cell Osmoregulation & Aperture Engine
# Declarative pathway source without hardcoded coordinates.

id: PPA-15
title: Stomata Guard Cell Osmoregulation & Aperture Engine
subtitle: Blue light hyperpolarization vs ABA-triggered depolarization driving turgor aperture dynamics
derived_from: MapMan4 BIN 34 Transport & BIN 30 Signaling, PlantCyc STOMATAL-REGULATION-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  Biophysical and biochemical control of stomatal pore aperture in paired guard cells. In response to
  morning blue light, photoreceptors PHOT1/2 activate BLUS1, stimulating the plasma membrane H+-ATPases
  (AHA1/2). Resulting hyperpolarization (-150 mV) drives massive K+ influx through KAT1/2 channels,
  balanced by PEPC-derived malate and chloride uptake, drawing in water via PIP2;1 aquaporins and swelling
  guard cells to open the pore. Under drought, stress-induced ABA triggers PYR/RCAR-mediated activation of
  SnRK2.6/OST1 kinase, which phosphorylates SLAC1/SLAH3 anion channels and stimulates RBOHD ROS generation.
  Membrane depolarization (-40 mV) opens GORK potassium release channels, causing turgor collapse and pore closure.

