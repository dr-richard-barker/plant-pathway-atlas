# PPA-08 — Specialized / Secondary Metabolism
# Declarative pathway source without hardcoded coordinates.

id: PPA-08
title: Specialized & Secondary Metabolism
subtitle: Phenylpropanoid entry, monolignol lignin polymerization, and anthocyanin flavonoid branching
derived_from: MapMan4 BIN 16 Secondary Metabolism, PlantCyc PHENYLPROPANOID-PWY & FLAVONOID-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  Specialized plant secondary metabolism. Phenylalanine is channeled into core phenylpropanoids
  by PAL, C4H, and 4CL, generating activated 4-coumaroyl-CoA. From this central branchpoint, flux
  bifurcates into: (1) monolignols via CCR and CAD for cell-wall lignification; and (2) flavonoids
  via Chalcone Synthase (CHS/TT4), CHI, F3H, and DFR, culminating in vacuolar anthocyanin and
  proanthocyanidin sequestration via GST transporter TT19.

