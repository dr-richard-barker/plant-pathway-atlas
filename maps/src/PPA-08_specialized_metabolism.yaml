  - id: core_phenylpropanoid
    compartment: cytosol
    node_width: 220
    nodes: [PAL_PHENYLALANINE_LYASE, C4H_HYDROXYLASE, FOUR_CL_LIGASE]

  - id: monolignol_branch
    compartment: cytosol
    node_width: 220
    nodes: [CCR_COA_REDUCTASE, CAD_ALCOHOL_DH, CELL_WALL_LIGNIFICATION]

  - id: flavonoid_biosynthesis
    compartment: endoplasmic_reticulum
    node_width: 220
    nodes: [CHALCONE_SYNTHASE_TT4, CHALCONE_ISOMERASE_TT5, FLAVANONE_3_HYDROXYLASE]

  - id: anthocyanin_vacuole_entry
    compartment: vacuole
    node_width: 220
    nodes: [DFR_REDUCTASE_TT3, ANS_LDOX_SYNTHASE, ANTHOCYANIN_EXPORT_TT19]

