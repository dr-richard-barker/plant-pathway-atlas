# PPA-05 — ROS Dynamics & Redox Homeostasis
# Modernized MapMan BIN 21 Redox & Stress Response

id: PPA-05
title: Reactive Oxygen Species (ROS) & Redox Homeostasis
subtitle: Superoxide generation, dismutation, the Foyer-Halliwell-Asada cycle, catalases, and thioredoxin relays
derived_from: MapMan BIN 21 & PlantCyc Redox Pathways
species_anchor: arabidopsis_thaliana

caption: >-
  Spatial and biochemical architecture of plant reactive oxygen species (ROS) metabolism.
  Covers apoplastic oxidative bursts catalyzed by respiratory burst oxidase homologs
  (RBOHD/F), superoxide dismutation by compartment-specific SOD isoforms (Cu/Zn-SOD, Fe-SOD,
  Mn-SOD), peroxide detoxification via the ascorbate-glutathione cycle (APX, MDHAR, DHAR, GR)
  and peroxisomal catalases, and downstream thioredoxin/glutaredoxin redox switches.

lanes:
  - id: superoxide_sources
    compartment: plasma_membrane
    node_width: 210
    nodes: [RBOH_BURST, APOPLAST_H2O2, METABOLIC_ROS_LEAK]

  - id: superoxide_dismutation
    compartment: cytosol
    node_width: 200
    nodes: [CSD_SOD_CYT, FSD_SOD_PLASTID, MSD_SOD_MITO]

  - id: peroxide_detoxification
    compartment: chloroplast_stroma
    node_width: 210
    nodes: [ASCORBATE_PEROXIDASE, PEROXIREDOXINS, CATALASE_SCAVENGING]

  - id: ascorbate_glutathione_cycle
    compartment: chloroplast_stroma
    node_width: 210
    nodes: [MDHAR_ENZYME, DHAR_ENZYME, GLUTATHIONE_REDUCTASE]

  - id: redox_relays
    compartment: cytosol
    node_width: 200
    nodes: [THIOREDOXIN_FAMILY, GLUTAREDOXIN_FAMILY, NPR1_TRANSLOCATION]

