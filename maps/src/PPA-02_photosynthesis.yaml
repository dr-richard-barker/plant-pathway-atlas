# PPA-02 — Photosynthesis & Chloroplast Bioenergetics
# Modernized MapMan BIN 1.1 Photosynthesis Light Reaction

id: PPA-02
title: Photosynthesis & Chloroplast Bioenergetics
subtitle: Z-scheme photochemistry, thylakoid electron transport, cyclic electron flow, and photophosphorylation
derived_from: MapMan BIN 1.1 & PlantCyc Photosynthetic Reactions
species_anchor: arabidopsis_thaliana

caption: >-
  Photosynthetic light reactions and thylakoid bioenergetics redrawn with deterministic
  geometry. Captures linear electron flow from water splitting at photosystem II (PSII)
  through the plastoquinone pool, cytochrome b6f complex, and plastocyanin to photosystem I
  (PSI), with ferredoxin-NADP+ reductase (FNR) producing NADPH. Cyclic electron flow via
  PGR5/PGRL1 and the chloroplast ATP synthase CF0-CF1 complex are explicitly resolved.

lanes:
  - id: photosystem_ii
    compartment: thylakoid_membrane
    node_width: 210
    nodes: [OEC_WATER_SPLITTING, PSII_CORE, LHCII_ANTENNA]

  - id: plastoquinone_cytochrome
    compartment: thylakoid_membrane
    node_width: 200
    nodes: [PLASTOQUINONE_POOL, CYTOCHROME_B6F, PLASTOCYANIN_POOL]

  - id: photosystem_i
    compartment: thylakoid_membrane
    node_width: 210
    nodes: [PSI_CORE, FERREDOXIN_POOL, FNR_REDUCTASE]

  - id: photophosphorylation
    compartment: thylakoid_membrane
    node_width: 210
    nodes: [CYCLIC_FLOW_PGR5, CHLORO_ATP_SYNTHASE, NADPH_ATP_OUTPUT]

