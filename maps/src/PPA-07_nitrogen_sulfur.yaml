# PPA-07 — Nitrogen & Sulfur Primary Assimilation
# Declarative pathway source without hardcoded coordinates.

id: PPA-07
title: Nitrogen & Sulfur Primary Assimilation
subtitle: Nitrate and sulfate reduction, GS-GOGAT ammonium incorporation, and cysteine/methionine biosynthesis
derived_from: MapMan4 BIN 12 Nitrogen Metabolism & BIN 14 Sulfur Metabolism, PlantCyc NITRATE-ASSIMILATION-PWY & SULFATE-ASSIMILATION-PWY
species_anchor: arabidopsis_thaliana

caption: >-
  Primary inorganic nitrogen and sulfur assimilation in plants. Soil nitrate is reduced to nitrite
  in the cytosol by Nitrate Reductase (NIA1/2), transported into the chloroplast, and reduced to
  ammonium by Nitrite Reductase (NIR1). Ammonium is assimilated into glutamate and glutamine via the
  coupled GS-GOGAT cycle. Concurrently, imported sulfate is activated by ATP Sulfurylase (APS) and
  reduced by APR and SiR to sulfide, which is condensed with O-acetylserine by OAS-TL to form cysteine.

lanes:
  - id: nitrate_reduction_cytosol
    compartment: cytosol
    node_width: 220
    nodes: [NITRATE_TRANSPORTERS, NITRATE_REDUCTASE_NIA, AMINO_ACID_EXPORT]

  - id: nitrite_ammonium_plastid
    compartment: chloroplast_stroma
    node_width: 220
    nodes: [NITRITE_REDUCTASE_NIR, GS_GLUTAMINE_SYNTH, GOGAT_GLUTAMATE_SYNTH]

  - id: sulfate_reduction_core
    compartment: chloroplast_stroma
    node_width: 220
    nodes: [SULFATE_TRANSPORTERS, ATP_SULFURYLASE_APS, APS_REDUCTASE_APR]

  - id: cysteine_methionine_branch
    compartment: chloroplast_stroma
    node_width: 220
    nodes: [CGS_METHIONINE_SYNTH, OASTL_CYSTEINE_SYNTH, SULFITE_REDUCTASE_SIR]

